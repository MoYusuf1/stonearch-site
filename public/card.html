<style>
  :root{
    --ink:#16161d; --bone:#ede9e0; --paper:#f6f3ec; --cobalt:#2a26e8;
    --butter:#ffd23f; --mute:#57565f; --line:#c9c3b6;
    --font-display:"Syne",system-ui,sans-serif; --font-body:"Hanken Grotesk",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-body);background:var(--bone);color:var(--ink);
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.25rem}
  .biz-card{background:var(--paper);border:1px solid var(--line);border-radius:6px;
            max-width:430px;width:100%;padding:2.2rem 1.8rem;box-shadow:0 18px 40px rgba(22,22,29,.12)}
  .biz-org{font-family:var(--font-display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em;margin:0}
  .biz-org::before{content:"";display:inline-block;width:.62em;height:.62em;background:var(--cobalt);
                   border-radius:2px;margin-right:.45em}
  .biz-name{font-family:var(--font-display);font-weight:700;font-size:1.05rem;margin:1.4rem 0 .15rem}
  .biz-title{margin:0;color:var(--ink)}
  .biz-loc{margin:.35rem 0 0;color:var(--mute)}
  .qr-placeholder{margin:1.6rem 0;border:2px dashed var(--line);border-radius:6px;padding:2rem 1rem;
                  text-align:center;color:var(--mute);font-size:.9rem}
  .card-actions{display:flex;flex-wrap:wrap;gap:.6rem}
  .btn{display:inline-block;font-family:var(--font-display);font-weight:700;text-decoration:none;
       background:var(--ink);color:var(--paper);padding:.7rem 1.1rem;border-radius:4px}
  .btn--accent{background:var(--cobalt);color:#fff}
  .btn--ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
  .contact-note{margin:1.4rem 0 0;color:var(--mute);font-size:.92rem}
</style>
</head>
<body>

<main class="biz-card" aria-label="Digital business card">
  <p class="biz-org">Stone Arch Web Design</p>
  <h1 class="biz-name">Mohamed Yusuf</h1>
  <p class="biz-title">Websites for local businesses</p>
  <p class="biz-loc">Minneapolis, MN · $499 one-page sites · $49/mo care</p>

  <div class="qr-placeholder" role="img" aria-label="Placeholder where a QR code linking to this page will go">
    <span>QR to this page goes here</span>
  </div>

  <div class="card-actions">
    <a class="btn btn--accent" href="mailto:stonearchwebdesign@gmail.com?subject=Free%20audit%20look%20for%20my%20business">Email</a>
    <a class="btn btn--ghost" href="contact.vcf" download>Save contact</a>
    <a class="btn btn--ghost" href="index.html#services">View services</a>
  </div>

  <p class="contact-note">stonearchwebdesign@gmail.com · Replies within one business day · Email only, no calls needed</p>
</main>

</body>
</html>
